version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      tooling-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 3
    labels: [dependencies, deployment]
    ignore:
      # The runtime stays on a long-term-support line. Moving to the next one is a deliberate change,
      # made together with the Node versions the pipeline tests.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 2
    labels: [dependencies, deployment]
