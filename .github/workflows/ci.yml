name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        if: matrix.node == 22
        run: pnpm audit --prod --audit-level=high
      - name: Typecheck source and tests
        run: pnpm typecheck
      - name: Test synthetic and in-memory fixtures
        run: pnpm test
      - name: Build server
        run: pnpm --filter @mon22r/server build
      - name: Build Mini App
        run: pnpm --filter @mon22r/miniapp build
      - name: Upload Mini App preview bundle
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miniapp-preview
          path: apps/miniapp/dist/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the deployment image without publishing
        run: docker build --tag mon22r:ci .
      - name: Verify packaged entry points without starting the bot
        run: |
          docker run --rm --entrypoint sh mon22r:ci -c '
            test -s apps/miniapp/dist/index.html &&
            test -s apps/server/dist/main.js &&
            node --check apps/server/dist/main.js
          '
          docker compose config --no-env-resolution --no-interpolate --quiet
